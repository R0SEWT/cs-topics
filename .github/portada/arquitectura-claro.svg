<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 446" width="1000" height="446" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">Arquitectura: la visión y el solver solo se hablan por la instancia</title>
<desc id="d">La app manda la foto al nodo; la Fase 1 la convierte en una instancia (tamaño y jaulas), que es lo único que ve la Fase 2. Si una etiqueta es ilegible o las jaulas no son válidas, pide otra foto antes del solver. CP-SAT resuelve y cuenta hasta dos soluciones: con una se devuelve, con ninguna intenta reparar la lectura, con varias rechaza.</desc>
<style></style>
<defs><marker id="punta-6B6E7B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6E7B"/></marker><marker id="punta-4B45C9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B45C9"/></marker><marker id="punta-D96A2B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D96A2B"/></marker><marker id="punta-B9B6AC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9B6AC"/></marker></defs>
<rect width="1000" height="446" rx="24" fill="#F5F3EE"/>
<rect x="206" y="22" width="772" height="214" rx="20" fill="none" stroke="#6B6E7B" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
<text x="228.0" y="50.0" font-size="17" font-weight="600" fill="#6B6E7B" text-anchor="start">Nodo · FastAPI en la PC</text>
<text x="958.0" y="50.0" font-size="16" font-weight="400" fill="#6B6E7B" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">POST /resolver</text>
<rect x="22" y="68" width="156" height="148" rx="16" fill="#FCFBF7" stroke="#DEDBD2" stroke-width="2.5"/><text x="100.0" y="108.0" font-size="25" font-weight="700" fill="#15161D" text-anchor="middle">App</text><text x="100.0" y="138.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">Android</text><text x="100.0" y="162.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">toma la foto</text>
<line x1="178" y1="142" x2="222" y2="142" stroke="#6B6E7B" stroke-width="3" marker-end="url(#punta-6B6E7B)"/>
<rect x="226" y="68" width="224" height="148" rx="16" fill="#FCFBF7" stroke="#DEDBD2" stroke-width="2.5"/><text x="338.0" y="108.0" font-size="25" font-weight="700" fill="#15161D" text-anchor="middle">Fase 1 · visión</text><text x="338.0" y="138.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">sin aprendizaje:</text><text x="338.0" y="162.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">rejilla, jaulas</text><text x="338.0" y="186.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">y etiquetas</text>
<line x1="450" y1="142" x2="490" y2="142" stroke="#6B6E7B" stroke-width="3" marker-end="url(#punta-6B6E7B)"/>
<rect x="494" y="68" width="196" height="148" rx="16" fill="#E4E1F7" stroke="#4B45C9" stroke-width="2.5" stroke-dasharray="7 6"/><text x="592.0" y="108.0" font-size="25" font-weight="700" fill="#4B45C9" text-anchor="middle">Instancia</text><text x="592.0" y="138.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">tamaño y jaulas:</text><text x="592.0" y="162.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">el contrato</text>
<line x1="690" y1="142" x2="730" y2="142" stroke="#6B6E7B" stroke-width="3" marker-end="url(#punta-6B6E7B)"/>
<rect x="734" y="68" width="224" height="148" rx="16" fill="#FCFBF7" stroke="#DEDBD2" stroke-width="2.5"/><text x="846.0" y="108.0" font-size="25" font-weight="700" fill="#15161D" text-anchor="middle">Fase 2 · CP-SAT</text><text x="846.0" y="138.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">resuelve y cuenta</text><text x="846.0" y="162.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">hasta 2 soluciones</text>
