[project]
name = "tb1-kenken-cv"
version = "0.1.0"
description = "TB1 — Fase 1: visión computacional sobre tableros KenKen"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
