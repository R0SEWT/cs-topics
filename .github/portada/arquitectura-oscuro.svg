<line x1="371.0" y1="270" x2="371.0" y2="296" stroke="#857FEE" stroke-width="3" marker-end="url(#punta-857FEE)"/>
<rect x="264" y="300" width="214" height="124" rx="16" fill="#2A2950" stroke="#857FEE" stroke-width="2.5"/><text x="371.0" y="340.0" font-size="25" font-weight="700" fill="#857FEE" text-anchor="middle">1 solución</text><text x="371.0" y="370.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">se devuelve</text>
<line x1="618.0" y1="270" x2="618.0" y2="296" stroke="#DD7436" stroke-width="3" marker-end="url(#punta-DD7436)"/>
<rect x="500" y="300" width="236" height="124" rx="16" fill="#3A2A22" stroke="#DD7436" stroke-width="2.5"/><text x="618.0" y="340.0" font-size="25" font-weight="700" fill="#F2A65A" text-anchor="middle">0 soluciones</text><text x="618.0" y="370.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">repara con la única</text><text x="618.0" y="394.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">corrección posible,</text><text x="618.0" y="418.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">o pide otra foto</text>
<line x1="868.0" y1="270" x2="868.0" y2="296" stroke="#5C5E6B" stroke-width="3" marker-end="url(#punta-5C5E6B)"/>
<rect x="758" y="300" width="220" height="124" rx="16" fill="#1F2029" stroke="#5C5E6B" stroke-width="2.5"/><text x="868.0" y="340.0" font-size="25" font-weight="700" fill="#B9B8CC" text-anchor="middle">2 o más</text><text x="868.0" y="370.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">se rechaza con</text><text x="868.0" y="394.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">un mensaje claro</text>
</svg>
