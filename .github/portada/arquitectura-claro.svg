<rect x="22" y="300" width="222" height="124" rx="16" fill="#FCFBF7" stroke="#B9B6AC" stroke-width="2.5"/><text x="133.0" y="340.0" font-size="25" font-weight="700" fill="#4A4D5A" text-anchor="middle">Sin lectura</text><text x="133.0" y="370.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">etiqueta ilegible o</text><text x="133.0" y="394.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">jaulas inválidas:</text><text x="133.0" y="418.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">pide otra foto</text>
<path d="M846,216 V270 M371.0,270 H868.0" fill="none" stroke="#6B6E7B" stroke-width="3" stroke-linecap="round"/>
<line x1="371.0" y1="270" x2="371.0" y2="296" stroke="#4B45C9" stroke-width="3" marker-end="url(#punta-4B45C9)"/>
<rect x="264" y="300" width="214" height="124" rx="16" fill="#E4E1F7" stroke="#4B45C9" stroke-width="2.5"/><text x="371.0" y="340.0" font-size="25" font-weight="700" fill="#4B45C9" text-anchor="middle">1 solución</text><text x="371.0" y="370.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">se devuelve</text>
<line x1="618.0" y1="270" x2="618.0" y2="296" stroke="#D96A2B" stroke-width="3" marker-end="url(#punta-D96A2B)"/>
<rect x="500" y="300" width="236" height="124" rx="16" fill="#F8E3D3" stroke="#D96A2B" stroke-width="2.5"/><text x="618.0" y="340.0" font-size="25" font-weight="700" fill="#B4501A" text-anchor="middle">0 soluciones</text><text x="618.0" y="370.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">repara con la única</text><text x="618.0" y="394.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">corrección posible,</text><text x="618.0" y="418.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">o pide otra foto</text>
<line x1="868.0" y1="270" x2="868.0" y2="296" stroke="#B9B6AC" stroke-width="3" marker-end="url(#punta-B9B6AC)"/>
<rect x="758" y="300" width="220" height="124" rx="16" fill="#FCFBF7" stroke="#B9B6AC" stroke-width="2.5"/><text x="868.0" y="340.0" font-size="25" font-weight="700" fill="#4A4D5A" text-anchor="middle">2 o más</text><text x="868.0" y="370.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">se rechaza con</text><text x="868.0" y="394.0" font-size="18" font-weight="400" fill="#4A4D5A" text-anchor="middle">un mensaje claro</text>
</svg>
