<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 512" width="880" height="512" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">El solver repara una lectura equivocada</title>
<desc id="d">Un KenKen de 6×6 leído de una foto real. La visión lee 3+ en 2 jaulas que dicen 3÷; CP-SAT demuestra que así no tiene solución, prueba lecturas vecinas, corrige esas jaulas y resuelve el tablero.</desc>
