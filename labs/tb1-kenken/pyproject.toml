[project]
name = "tb1-kenken-cv"
version = "0.1.0"
description = "TB1 — Fase 1: visión computacional sobre tableros KenKen"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "ortools>=9.15.6755",
    "pillow>=10.0",
    "pypdfium2>=5.13.0",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
