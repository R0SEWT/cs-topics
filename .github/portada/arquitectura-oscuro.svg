<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 446" width="1000" height="446" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">Arquitectura: la visión y el solver solo se hablan por la instancia</title>
<desc id="d">La app manda la foto al nodo; la Fase 1 la convierte en una instancia (tamaño y jaulas), que es lo único que ve la Fase 2. Si una etiqueta es ilegible o las jaulas no son válidas, pide otra foto antes del solver. CP-SAT resuelve y cuenta hasta dos soluciones: con una se devuelve, con ninguna intenta reparar la lectura, con varias rechaza.</desc>
<style></style>
<defs><marker id="punta-9A99AD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A99AD"/></marker><marker id="punta-857FEE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#857FEE"/></marker><marker id="punta-DD7436" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DD7436"/></marker><marker id="punta-5C5E6B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C5E6B"/></marker></defs>
<rect width="1000" height="446" rx="24" fill="#15161D"/>
<rect x="206" y="22" width="772" height="214" rx="20" fill="none" stroke="#9A99AD" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
<text x="228.0" y="50.0" font-size="17" font-weight="600" fill="#9A99AD" text-anchor="start">Nodo · FastAPI en la PC</text>
<text x="958.0" y="50.0" font-size="16" font-weight="400" fill="#9A99AD" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">POST /resolver</text>
<rect x="22" y="68" width="156" height="148" rx="16" fill="#1F2029" stroke="#2E3040" stroke-width="2.5"/><text x="100.0" y="108.0" font-size="25" font-weight="700" fill="#EDEBF5" text-anchor="middle">App</text><text x="100.0" y="138.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">Android</text><text x="100.0" y="162.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">toma la foto</text>
<line x1="178" y1="142" x2="222" y2="142" stroke="#9A99AD" stroke-width="3" marker-end="url(#punta-9A99AD)"/>
<rect x="226" y="68" width="224" height="148" rx="16" fill="#1F2029" stroke="#2E3040" stroke-width="2.5"/><text x="338.0" y="108.0" font-size="25" font-weight="700" fill="#EDEBF5" text-anchor="middle">Fase 1 · visión</text><text x="338.0" y="138.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">sin aprendizaje:</text><text x="338.0" y="162.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">rejilla, jaulas</text><text x="338.0" y="186.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">y etiquetas</text>
<line x1="450" y1="142" x2="490" y2="142" stroke="#9A99AD" stroke-width="3" marker-end="url(#punta-9A99AD)"/>
<rect x="494" y="68" width="196" height="148" rx="16" fill="#2A2950" stroke="#857FEE" stroke-width="2.5" stroke-dasharray="7 6"/><text x="592.0" y="108.0" font-size="25" font-weight="700" fill="#857FEE" text-anchor="middle">Instancia</text><text x="592.0" y="138.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">tamaño y jaulas:</text><text x="592.0" y="162.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">el contrato</text>
<line x1="690" y1="142" x2="730" y2="142" stroke="#9A99AD" stroke-width="3" marker-end="url(#punta-9A99AD)"/>
<rect x="734" y="68" width="224" height="148" rx="16" fill="#1F2029" stroke="#2E3040" stroke-width="2.5"/><text x="846.0" y="108.0" font-size="25" font-weight="700" fill="#EDEBF5" text-anchor="middle">Fase 2 · CP-SAT</text><text x="846.0" y="138.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">resuelve y cuenta</text><text x="846.0" y="162.0" font-size="18" font-weight="400" fill="#B9B8CC" text-anchor="middle">hasta 2 soluciones</text>
