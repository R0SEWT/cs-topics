[project]
name = "cs-topics-cp"
version = "0.1.0"
description = "Constraint Programming — Tópicos en CC (1ACC0058), unidades 2-4"
requires-python = ">=3.11,<3.14"
dependencies = ["ortools>=9.11"]

[dependency-groups]
dev = ["pytest>=8"]
# Solo para notebooks/; `uv sync` y la CI no lo instalan.
notebook = ["jupyterlab>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
